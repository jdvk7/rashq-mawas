name: Build Rashq Mawas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: rashq_app
        run: flutter pub get

      - name: Build APK
        working-directory: rashq_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rashq-mawas-apk
          path: rashq_app/build/app/outputs/flutter-apk/app-release.apk
